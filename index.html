<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Оздоровительная карта России</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#062c57}
    body{overflow-x:hidden;font-family:Arial,Helvetica,sans-serif}
    .page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#062c57}
    .canvas{position:relative;width:100%;max-width:1178px;aspect-ratio:1178/697;overflow:hidden;background:#062c57}
    .canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;display:block;background:transparent;border:0;padding:0;margin:0;cursor:pointer;outline:none}
    .regions{left:28.2%;top:5.1%;width:6.1%;height:5%}.places{left:34.2%;top:5.1%;width:8.2%;height:5%}.goods{left:42.9%;top:5.1%;width:5.7%;height:5%}.practices{left:49.0%;top:5.1%;width:6.9%;height:5%}.about{left:55.8%;top:5.1%;width:6.7%;height:5%}
    .login{left:72.2%;top:3.7%;width:8.2%;height:6.1%}.join{left:81.4%;top:3.7%;width:14.6%;height:6.1%}
    .search{left:10.4%;top:38.5%;width:36.2%;height:6.7%}.card1{left:10.3%;top:47.4%;width:9.7%;height:13.6%}.card2{left:20.3%;top:47.4%;width:9.7%;height:13.6%}.card3{left:30.3%;top:47.4%;width:9.8%;height:13.6%}.card4{left:40.4%;top:47.4%;width:9.3%;height:13.6%}
    @media(max-width:700px){.page{align-items:flex-start}.canvas{min-width:900px;transform-origin:top left}body{overflow-x:auto}}
  </style>
</head>
<body>
  <main class="page">
    <div class="canvas" aria-label="Оздоровительная карта России">
      <img src="assets/hero-reference.jpeg" alt="Оздоровительная карта России">
      <a class="hotspot regions" href="#regions" aria-label="Регионы"></a>
      <a class="hotspot places" href="#places" aria-label="Места отдыха"></a>
      <a class="hotspot goods" href="#goods" aria-label="Товары"></a>
      <a class="hotspot practices" href="#practices" aria-label="Практики"></a>
      <a class="hotspot about" href="#about" aria-label="О проекте"></a>
      <button class="hotspot login" aria-label="Войти" onclick="alert('Вход будет подключён на следующем этапе')"></button>
      <button class="hotspot join" aria-label="Стать участником" onclick="alert('Форма участника будет подключена на следующем этапе')"></button>
      <button class="hotspot search" aria-label="Выберите регион" onclick="alert('Поиск региона будет подключён к интерактивной карте')"></button>
      <a class="hotspot card1" href="#places" aria-label="Места для отдыха"></a>
      <a class="hotspot card2" href="#goods" aria-label="Товары для здоровья"></a>
      <a class="hotspot card3" href="#practices" aria-label="Практики и технологии"></a>
      <a class="hotspot card4" href="#regions" aria-label="Регионы России"></a>
    </div>
  </main>
</body>
</html>
